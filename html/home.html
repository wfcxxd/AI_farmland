  <!-- 主题初始化：必须在样式表之前、同步执行（不能加 type="module"），
       否则深色模式下会先按浅色绘制一帧，切页面时闪白。 -->
  <script>
    (function () {
      try {
        var T = ["light", "dark"], t = null;
        try { t = new URLSearchParams(location.search).get("theme"); } catch (e) {}
        if (T.indexOf(t) < 0) { try { t = localStorage.getItem("theme"); } catch (e) {} }
        if (T.indexOf(t) < 0) t = "light";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "light");
      }
    })();
  </script>
